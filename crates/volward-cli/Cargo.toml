[package]
name = "volward-cli"
description = "Volward command-line smoke tests"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "volward-cli"
path = "src/main.rs"

[dependencies]
volward-core = { path = "../volward-core" }
platform-desktop = { path = "../platform-desktop" }
serde_json = { workspace = true }
postcard = { version = "1", features = ["use-std"] }
