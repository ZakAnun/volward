syntax = "proto3";

package volward;

// Wire schema for Rust <-> Flutter snapshot transfer.
//
// Kept field-for-field aligned with `volward_core::model` so the Rust facade
// can encode `StorageSnapshot` directly (via prost) and the Flutter client can
// decode into typed messages — replacing the JSON + Map<String,dynamic>
// pipeline that dominates memory during large scans.
//
// Only the snapshot/checkpoint payload lives here (the heavy, high-frequency
// transfer). Small, low-frequency payloads (ScanProgress, PlatformCapabilities,
// DeleteReport, quick_list_dir) can stay on JSON — moving them buys nothing.

enum CapabilityLevel {
  CAPABILITY_LEVEL_UNSPECIFIED = 0;
  CAPABILITY_LEVEL_FULL_PATH = 1;
  CAPABILITY_LEVEL_APP_STATS_ONLY = 2;
  CAPABILITY_LEVEL_GUIDED_ONLY = 3;
}

enum EntryCategory {
  ENTRY_CATEGORY_UNSPECIFIED = 0;
  ENTRY_CATEGORY_CACHE = 1;
  ENTRY_CATEGORY_TEMP = 2;
  ENTRY_CATEGORY_MEDIA = 3;
  ENTRY_CATEGORY_APP_DATA = 4;
  ENTRY_CATEGORY_ORPHAN = 5;
  ENTRY_CATEGORY_DUPLICATE = 6;
  ENTRY_CATEGORY_SYSTEM = 7;
  ENTRY_CATEGORY_UNKNOWN = 8;
  ENTRY_CATEGORY_BUILD_ARTIFACT = 9;
}

enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_LOW = 1;
  RISK_LEVEL_MEDIUM = 2;
  RISK_LEVEL_HIGH = 3;
}

enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_DIRECTORY = 1;
  SOURCE_TYPE_FILE = 2;
  SOURCE_TYPE_VOLUME = 3;
  SOURCE_TYPE_APPLICATION = 4;
}

message StorageEntry {
  string id = 1;
  string display_name = 2;
  string path_or_uri = 3;
  uint64 size_bytes = 4;
  EntryCategory category = 5;
  RiskLevel risk_level = 6;
  SourceType source_type = 7;
  bool deletable = 8;
  string reason = 9;
  // File modification time in epoch milliseconds; absent for directories,
  // unavailable metadata, or old snapshots (never guessed).
  optional int64 modified_at_ms = 10;
}

message ScanTreeNode {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  uint64 size_bytes = 4;
  optional string entry_id = 5;
  repeated ScanTreeNode children = 6;

  // Client-only progressive-scan markers. The Rust producer never sets these
  // (they default to false). The Flutter merge stamps `scanned` as directories
  // are rediscovered by a background checkpoint, and `peek_scanned` when an
  // authoritative Wave-2 peek scan resolves a directory. They live in the
  // message so the merge can run on typed nodes instead of Map<String,dynamic>.
  bool scanned = 7;
  bool peek_scanned = 8;
}

message ScanStats {
  uint64 paths_seen = 1;
  uint64 dirs_seen = 2;
  uint64 files_seen = 3;
  uint64 files_in_snapshot = 4;
  uint64 paths_skipped = 5;
  bool truncated = 6;
  optional string incomplete_reason = 7;
}

message StorageSnapshot {
  string snapshot_id = 1;
  int64 scanned_at_ms = 2;
  CapabilityLevel capability = 3;
  uint64 volume_total_bytes = 4;
  uint64 volume_used_bytes = 5;
  uint64 reclaimable_estimate_bytes = 6;
  repeated StorageEntry entries = 7;
  ScanTreeNode tree = 8;
  ScanStats stats = 9;
  repeated string warnings = 10;
}

// ---------------------------------------------------------------------------
// SnapshotIndex — compact catalog persisted per scan root (replaces JSON v5)
// ---------------------------------------------------------------------------

message IndexDirectoryRecord {
  optional uint32 parent = 1;
  uint32 name = 2;
  uint64 size_bytes = 3;
  bool scanned = 4;
  bool peek_scanned = 5;
  uint64 category_mask = 6;
  uint64 deletable_category_mask = 7;
  uint64 deletable_file_count = 8;
}

message IndexEntryRecord {
  uint32 id = 1;
  uint32 path = 2;
  uint32 parent_path = 3;
  uint32 display_name = 4;
  uint64 size_bytes = 5;
  uint32 category = 6;
  bool deletable = 7;
  optional int64 modified_at_ms = 8;
}

message IndexDirectoryMapEntry {
  uint32 id = 1;
  IndexDirectoryRecord record = 2;
}

message IndexEntryMapEntry {
  uint32 id = 1;
  IndexEntryRecord record = 2;
}

message IndexU32Pair {
  uint32 key = 1;
  uint32 value = 2;
}

message IndexU32U64Pair {
  uint32 key = 1;
  uint64 value = 2;
}

message IndexChildrenEntry {
  uint32 key = 1;
  repeated uint32 child_ids = 2;
}

message IndexStringCountEntry {
  string key = 1;
  uint64 value = 2;
}

message SnapshotIndex {
  uint32 format_version = 1;
  string snapshot_id = 2;
  string root_path = 3;
  int64 scanned_at_ms = 4;
  uint64 version = 5;
  string scan_state = 6;
  uint64 reclaimable_estimate_bytes = 7;
  ScanStats stats = 8;
  repeated string strings = 9;
  uint32 root_id = 10;
  repeated IndexDirectoryMapEntry directories = 11;
  repeated IndexEntryMapEntry entries = 12;
  repeated IndexU32Pair entry_id_by_path = 13;
  repeated IndexU32U64Pair file_size_by_path = 14;
  repeated IndexChildrenEntry children = 15;
  repeated IndexStringCountEntry category_counts = 16;
  repeated IndexStringCountEntry deletable_counts = 17;
}
