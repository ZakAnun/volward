# Usage: docker compose -f docker-compose.yml -f server/docker-compose.extend.yml up -d

services:
  platform-api:
    image: ghcr.io/YOUR_ORG/volward-platform:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:/data/platform.db
      - JWT_SECRET=${JWT_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=noreply@yourdomain.com
      # Do not set ALLOW_LOG_MAILER in production — OTP would be logged in plaintext.
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET}
      - PADDLE_ENV=${PADDLE_ENV:-sandbox}
      - RUST_LOG=info
    volumes:
      - platform-data:/data
    networks:
      - volward-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      retries: 3

volumes:
  platform-data:

networks:
  volward-net:
    external: true
