name: Website Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-website:
    name: Build website
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    env:
      SITE_URL: ${{ vars.SITE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      APTABASE_WEB_KEY: ${{ secrets.APTABASE_WEB_KEY }}
      APTABASE_HOST: ${{ secrets.APTABASE_HOST }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate website release config
        run: |
          if [ -z "${SITE_URL:-}" ]; then
            echo "Missing repository variable: SITE_URL"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      - name: Build website
        run: bash scripts/website_release.sh

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-release
          path: apps/website/dist
          if-no-files-found: error
