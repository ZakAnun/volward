name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            artifact: macos-release-x64
          - runner: macos-15
            arch: arm64
            artifact: macos-release-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: brew install protobuf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: apps/volward

      - name: Build Rust dylib
        run: cargo build --release -p volward-facade

      - name: Copy dylib for macOS build
        run: |
          cd apps/volward/macos && bash build_rust.sh
        env:
          CONFIGURATION: Release

      - name: Build macOS app
        working-directory: apps/volward
        env:
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          APTABASE_HOST: ${{ secrets.APTABASE_HOST }}
          VOLWARD_API_BASE: ${{ secrets.VOLWARD_API_BASE }}
        run: |
          if [ -z "$APTABASE_APP_KEY" ] || [ -z "$APTABASE_HOST" ]; then
            echo "Missing repository secrets: APTABASE_APP_KEY and/or APTABASE_HOST"
            exit 1
          fi
          case "$VOLWARD_API_BASE" in
            https://*/v1) ;;
            *)
              echo "Missing or invalid repository variable: VOLWARD_API_BASE (expected https://.../v1 without a trailing slash)"
              exit 1
              ;;
          esac
          # Nested Rust dylib is ad-hoc signed in macos/build_rust.sh (required on
          # Intel CI). Do not pass xcodebuild args after "--": flutter treats them
          # as Dart entrypoints ("Target file CODE_SIGN_IDENTITY=- not found").
          flutter build macos --release \
            --dart-define="APTABASE_APP_KEY=$APTABASE_APP_KEY" \
            --dart-define="APTABASE_HOST=$APTABASE_HOST" \
            --dart-define="VOLWARD_API_BASE=$VOLWARD_API_BASE"

      - name: Verify macOS bundle
        env:
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          VOLWARD_API_BASE: ${{ secrets.VOLWARD_API_BASE }}
        run: |
          APP=apps/volward/build/macos/Build/Products/Release/volward.app
          DYLIB="$APP/Contents/Frameworks/libvolward_facade.dylib"
          BIN="$APP/Contents/MacOS/volward"
          # Dart AOT snapshot lives in App.framework, not the runner executable.
          APP_SNAPSHOT="$APP/Contents/Frameworks/App.framework/Versions/Current/App"
          test -d "$APP"
          test -x "$BIN"
          test -f "$DYLIB"
          test -f "$APP_SNAPSHOT"
          codesign --verify --verbose=2 "$DYLIB"
          codesign --verify --verbose=2 "$APP"
          # Ensure Aptabase key was compiled into the Dart snapshot (not Noop).
          if ! strings "$APP_SNAPSHOT" | grep -Fq "$APTABASE_APP_KEY"; then
            echo "Aptabase key not found in macOS App.framework — dart-define may be missing"
            exit 1
          fi
          echo "Aptabase key present in macOS App.framework"
          if ! strings "$APP_SNAPSHOT" | grep -Fq "$VOLWARD_API_BASE"; then
            echo "Volward API base not found in macOS App.framework — dart-define may be missing"
            exit 1
          fi
          echo "Volward API base present in macOS App.framework"

      - name: Get version
        id: version
        run: |
          # Asset names must match the release tag (updater uses tag without leading v).
          TAG_NAME="${GITHUB_REF_NAME:-}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected tag like vX.Y.Z, got: $TAG_NAME"
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          VERSION_RAW=$(grep '^version:' apps/volward/pubspec.yaml | sed 's/version: //' | tr -d ' ')
          PUBSPEC_VERSION="${VERSION_RAW%%+*}"
          if [[ "$PUBSPEC_VERSION" != "$VERSION" ]]; then
            echo "pubspec.yaml version ($PUBSPEC_VERSION) must match release tag version ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_raw=$VERSION_RAW" >> $GITHUB_OUTPUT

      - name: Create macOS archive
        run: |
          cd apps/volward/build/macos/Build/Products/Release
          COPYFILE_DISABLE=1 ditto -c -k --norsrc --keepParent volward.app volward-v${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.zip
          mv volward-v${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.zip $GITHUB_WORKSPACE/

      - name: Create macOS checksum
        run: |
          cd $GITHUB_WORKSPACE
          shasum -a 256 volward-v${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.zip > volward-v${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.zip.sha256

      - name: Create latest copy
        run: |
          cp volward-v${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.zip \
             volward-latest-macos-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            volward-*.zip
            volward-*.zip.sha256

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: choco install protoc -y --no-progress

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: apps/volward

      - name: Build Rust dylib
        run: cargo build --release -p volward-facade

      - name: Copy DLL to Flutter build output
        shell: bash
        run: |
          cp target/release/volward_facade.dll apps/volward/windows/

      - name: Build Windows app
        working-directory: apps/volward
        env:
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          APTABASE_HOST: ${{ secrets.APTABASE_HOST }}
          VOLWARD_API_BASE: ${{ secrets.VOLWARD_API_BASE }}
        shell: bash
        run: |
          if [ -z "$APTABASE_APP_KEY" ] || [ -z "$APTABASE_HOST" ]; then
            echo "Missing repository secrets: APTABASE_APP_KEY and/or APTABASE_HOST"
            exit 1
          fi
          case "$VOLWARD_API_BASE" in
            https://*/v1) ;;
            *)
              echo "Missing or invalid repository variable: VOLWARD_API_BASE (expected https://.../v1 without a trailing slash)"
              exit 1
              ;;
          esac
          flutter build windows --release \
            --dart-define="APTABASE_APP_KEY=$APTABASE_APP_KEY" \
            --dart-define="APTABASE_HOST=$APTABASE_HOST" \
            --dart-define="VOLWARD_API_BASE=$VOLWARD_API_BASE"

      - name: Copy DLL to release bundle
        shell: bash
        run: |
          cp target/release/volward_facade.dll apps/volward/build/windows/x64/runner/Release/

      - name: Verify Windows bundle
        shell: pwsh
        env:
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          VOLWARD_API_BASE: ${{ secrets.VOLWARD_API_BASE }}
        run: |
          $bundle = "$env:GITHUB_WORKSPACE\apps\volward\build\windows\x64\runner\Release"
          foreach ($path in @(
            "$bundle\volward.exe",
            "$bundle\volward_facade.dll",
            "$bundle\flutter_windows.dll",
            "$bundle\data\icudtl.dat",
            "$bundle\data\flutter_assets"
          )) {
            if (!(Test-Path $path)) {
              throw "Missing Windows release file: $path"
            }
          }
          # Dart AOT snapshot lives in data/app.so, not the runner .exe.
          $appSo = Join-Path $bundle "data\app.so"
          if (!(Test-Path $appSo)) {
            throw "Missing Windows Dart snapshot: $appSo"
          }
          $bytes = [System.IO.File]::ReadAllBytes($appSo)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          if ($text -notlike "*$env:APTABASE_APP_KEY*") {
            throw "Aptabase key not found in Windows data/app.so — dart-define may be missing"
          }
          Write-Host "Aptabase key present in Windows data/app.so"
          if ($text -notlike "*$env:VOLWARD_API_BASE*") {
            throw "Volward API base not found in Windows data/app.so — dart-define may be missing"
          }
          Write-Host "Volward API base present in Windows data/app.so"

      - name: Get version
        id: version
        shell: bash
        run: |
          # Asset names must match the release tag (updater uses tag without leading v).
          TAG_NAME="${GITHUB_REF_NAME:-}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected tag like vX.Y.Z, got: $TAG_NAME"
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          VERSION_RAW=$(grep '^version:' apps/volward/pubspec.yaml | sed 's/version: //' | tr -d ' \r')
          PUBSPEC_VERSION="${VERSION_RAW%%+*}"
          if [[ "$PUBSPEC_VERSION" != "$VERSION" ]]; then
            echo "pubspec.yaml version ($PUBSPEC_VERSION) must match release tag version ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_raw=$VERSION_RAW" >> $GITHUB_OUTPUT

      - name: Build Windows installer
        shell: pwsh
        run: |
          $appVersion = "${{ steps.version.outputs.version }}"
          iscc `
            /DAppVersion="$appVersion" `
            /DSourceDir="$env:GITHUB_WORKSPACE\apps\volward\build\windows\x64\runner\Release" `
            /DOutputDir="$env:GITHUB_WORKSPACE" `
            /DIconFile="$env:GITHUB_WORKSPACE\apps\volward\windows\runner\resources\app_icon.ico" `
            "$env:GITHUB_WORKSPACE\scripts\windows\volward.iss"
          if (!(Test-Path "VolwardSetup-v$appVersion-windows-x64.exe")) {
            throw "Windows installer missing: VolwardSetup-v$appVersion-windows-x64.exe"
          }

      - name: Create Windows checksum
        shell: pwsh
        run: |
          $appVersion = "${{ steps.version.outputs.version }}"
          $file = "VolwardSetup-v$appVersion-windows-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$file.sha256" -Value "$hash  $file"

      - name: Create latest copy
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Copy-Item "VolwardSetup-v$v-windows-x64.exe" "VolwardSetup-latest-windows-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            VolwardSetup-*.exe
            VolwardSetup-*.exe.sha256

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libfuse2 \
            unzip

      # Ubuntu 22.04 apt protobuf (3.12) rejects proto3 optional fields.
      # Install a modern official protoc binary instead of protobuf-compiler.
      - name: Install protoc
        run: |
          PROTOC_VERSION=27.1
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc
          sudo unzip -o /tmp/protoc.zip -d /usr/local 'include/*'
          protoc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: apps/volward

      - name: Build Rust dylib
        run: cargo build --release -p volward-facade

      - name: Build Linux app
        working-directory: apps/volward
        env:
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          APTABASE_HOST: ${{ secrets.APTABASE_HOST }}
          VOLWARD_API_BASE: ${{ secrets.VOLWARD_API_BASE }}
        run: |
          if [ -z "$APTABASE_APP_KEY" ] || [ -z "$APTABASE_HOST" ]; then
            echo "Missing repository secrets: APTABASE_APP_KEY and/or APTABASE_HOST"
            exit 1
          fi
          case "$VOLWARD_API_BASE" in
            https://*/v1) ;;
            *)
              echo "Missing or invalid repository variable: VOLWARD_API_BASE (expected https://.../v1 without a trailing slash)"
              exit 1
              ;;
          esac
          flutter build linux --release \
            --dart-define="APTABASE_APP_KEY=$APTABASE_APP_KEY" \
            --dart-define="APTABASE_HOST=$APTABASE_HOST" \
            --dart-define="VOLWARD_API_BASE=$VOLWARD_API_BASE"

      - name: Copy .so to bundle/lib
        run: |
          mkdir -p apps/volward/build/linux/x64/release/bundle/lib
          cp target/release/libvolward_facade.so apps/volward/build/linux/x64/release/bundle/lib/

      - name: Verify Linux bundle
        env:
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          VOLWARD_API_BASE: ${{ secrets.VOLWARD_API_BASE }}
        run: |
          BIN=apps/volward/build/linux/x64/release/bundle/volward
          # Dart AOT snapshot lives in lib/libapp.so, not the runner executable.
          APP_SO=apps/volward/build/linux/x64/release/bundle/lib/libapp.so
          test -x "$BIN"
          test -f apps/volward/build/linux/x64/release/bundle/lib/libvolward_facade.so
          test -f "$APP_SO"
          test -f apps/volward/build/linux/x64/release/bundle/data/icudtl.dat
          test -d apps/volward/build/linux/x64/release/bundle/data/flutter_assets
          # Ensure Aptabase key was compiled into the Dart snapshot (not Noop).
          if ! strings "$APP_SO" | grep -Fq "$APTABASE_APP_KEY"; then
            echo "Aptabase key not found in Linux libapp.so — dart-define may be missing"
            exit 1
          fi
          echo "Aptabase key present in Linux libapp.so"
          if ! strings "$APP_SO" | grep -Fq "$VOLWARD_API_BASE"; then
            echo "Volward API base not found in Linux libapp.so — dart-define may be missing"
            exit 1
          fi
          echo "Volward API base present in Linux libapp.so"

      - name: Get version
        id: version
        run: |
          # Asset names must match the release tag (updater uses tag without leading v).
          TAG_NAME="${GITHUB_REF_NAME:-}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected tag like vX.Y.Z, got: $TAG_NAME"
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          VERSION_RAW=$(grep '^version:' apps/volward/pubspec.yaml | sed 's/version: //' | tr -d ' ')
          PUBSPEC_VERSION="${VERSION_RAW%%+*}"
          if [[ "$PUBSPEC_VERSION" != "$VERSION" ]]; then
            echo "pubspec.yaml version ($PUBSPEC_VERSION) must match release tag version ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_raw=$VERSION_RAW" >> $GITHUB_OUTPUT

      - name: Create Linux archive
        run: |
          cd apps/volward/build/linux/x64/release
          tar -czf volward-v${{ steps.version.outputs.version }}-linux-x64.tar.gz bundle
          mv volward-v${{ steps.version.outputs.version }}-linux-x64.tar.gz $GITHUB_WORKSPACE/

      - name: Create Linux archive checksum
        run: |
          cd $GITHUB_WORKSPACE
          sha256sum volward-v${{ steps.version.outputs.version }}-linux-x64.tar.gz > volward-v${{ steps.version.outputs.version }}-linux-x64.tar.gz.sha256

      - name: Download appimagetool
        run: |
          mkdir -p tools
          curl -LfsS \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o tools/appimagetool-x86_64.AppImage
          chmod +x tools/appimagetool-x86_64.AppImage

      - name: Build Linux AppImage
        env:
          APPIMAGETOOL_BIN: ${{ github.workspace }}/tools/appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          bash scripts/linux/build_appimage.sh \
            --bundle-dir apps/volward/build/linux/x64/release/bundle \
            --output-dir "$GITHUB_WORKSPACE" \
            --version "${{ steps.version.outputs.version }}" \
            --icon-source apps/volward/linux/icons/volward.png

      - name: Verify Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          APPIMAGE=$(ls Volward-v*-linux-x86_64.AppImage | head -n 1)
          test -f "$APPIMAGE"
          # Relative filenames are not on PATH; require ./ prefix.
          "./$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/volward
          test -f squashfs-root/lib/libvolward_facade.so
          test -f squashfs-root/volward.png
          test -f squashfs-root/.DirIcon
          test -f squashfs-root/usr/share/icons/hicolor/256x256/apps/volward.png
          grep -q 'Icon=volward' squashfs-root/volward.desktop
          rm -rf squashfs-root

      - name: Create Linux AppImage checksum
        run: |
          cd $GITHUB_WORKSPACE
          sha256sum Volward-v${{ steps.version.outputs.version }}-linux-x86_64.AppImage > Volward-v${{ steps.version.outputs.version }}-linux-x86_64.AppImage.sha256

      - name: Create latest copy
        run: |
          cp Volward-v${{ steps.version.outputs.version }}-linux-x86_64.AppImage \
             Volward-latest-linux-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            volward-*.tar.gz
            volward-*.tar.gz.sha256

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            Volward-v*-linux-x86_64.AppImage
            Volward-v*-linux-x86_64.AppImage.sha256
            Volward-latest-linux-x86_64.AppImage

  create-release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/macos-release-arm64/*
            artifacts/macos-release-x64/*
            artifacts/windows-release/*
            artifacts/linux-release/*
            artifacts/linux-appimage/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
