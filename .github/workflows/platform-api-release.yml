name: Platform API Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (e.g. v0.0.6). Used for redeploy without rebuilding.'
        required: true
        type: string

jobs:
  publish-image:
    name: Publish Platform API image
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/volward-platform-api

    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: |
          owner_lc=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${owner_lc}/volward-platform-api" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-platform-api:
    name: Deploy Platform API
    runs-on: ubuntu-22.04
    needs: [publish-image]
    if: |
      always() && (
        needs.publish-image.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && needs.publish-image.result == 'skipped')
      )
    permissions:
      contents: read
      packages: read

    env:
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      PLATFORM_DEPLOY_USER: ${{ secrets.PLATFORM_DEPLOY_USER }}
      PLATFORM_DEPLOY_KEY: ${{ secrets.PLATFORM_DEPLOY_KEY }}
      PLATFORM_JWT_SECRET: ${{ secrets.PLATFORM_JWT_SECRET }}
      PLATFORM_DEEPSEEK_API_KEY: ${{ secrets.PLATFORM_DEEPSEEK_API_KEY }}
      PLATFORM_RESEND_API_KEY: ${{ secrets.PLATFORM_RESEND_API_KEY }}
      PLATFORM_RESEND_FROM: ${{ secrets.PLATFORM_RESEND_FROM }}
      PLATFORM_PADDLE_API_KEY: ${{ secrets.PLATFORM_PADDLE_API_KEY }}
      PLATFORM_PADDLE_WEBHOOK_SECRET: ${{ secrets.PLATFORM_PADDLE_WEBHOOK_SECRET }}
      PLATFORM_PADDLE_ENV: ${{ vars.PLATFORM_PADDLE_ENV }}
      PLATFORM_GHCR_READ_TOKEN: ${{ secrets.PLATFORM_GHCR_READ_TOKEN }}
      PLATFORM_GHCR_USER: ${{ vars.PLATFORM_GHCR_USER }}
      PLATFORM_HEALTHCHECK_URL: ${{ secrets.PLATFORM_HEALTHCHECK_URL }}
      VOLWARD_API_BASE: ${{ secrets.VOLWARD_API_BASE }}

    steps:
      - uses: actions/checkout@v4

      - name: Set platform image
        run: |
          owner_lc=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          echo "PLATFORM_IMAGE=ghcr.io/${owner_lc}/volward-platform-api:${version}" >> "$GITHUB_ENV"

      - name: Deploy platform API
        run: bash scripts/platform_api_release.sh
